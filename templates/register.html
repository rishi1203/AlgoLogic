<style>
    .register{
        background: -webkit-linear-gradient(left, #fff, #fff);

    .footer{

    .container{
      width: 100% !important;

    .register-left{
        text-align: center;
        color: #fff;
        margin-top: 4%;

    .register-left input{
        border: none;
        border-radius: 1.5rem;
        padding: 2%;
        width: 60%;
        background: #fff;
        font-weight: bold;
        color: #383d41;
        margin-top: 30%;
        margin-bottom: 3%;
        cursor: pointer;
    }
    .register-right{
        background: #fff;
        border-top-left-radius: 10% 100%;
        border-bottom-left-radius: 10% 50%;
    }
    .register-left img{
        margin-top: 15%;
        margin-bottom: 5%;
        width: 25%;
        -webkit-animation: mover 2s infinite  alternate;
        animation: mover 1s infinite  alternate;
    }
    @-webkit-keyframes mover {
        0% { transform: translateY(0); }
        100% { transform: translateY(-20px); }
    }
    @keyframes mover {
        0% { transform: translateY(0); }
        100% { transform: translateY(-20px); }
    }
    .register-left p{
        font-weight: lighter;
        padding: 2%;
        margin-top: -9%;
    }
    .register .register-form{
        padding: 10%;
        margin-top: 10%;
    }
    .btnRegister{
        float: right;
        margin-top: 10%;
        border: none;
        border-radius: 1.5rem;
        padding: 2%;
        background: #0492C2;
        color: rgb(243, 247, 242);
        font-weight: 600;
        width: 50%;
        cursor: pointer;
    }
    .register .nav-tabs{
        margin-top: 3%;
        border: none;
        background: #d9e6da;
        border-radius: 1.5rem;
        width: 28%;
        float: right;
    }
    .register .nav-tabs .nav-link{
        padding: 2%;
        height: 34px;
        font-weight: 600;
        color: rgb(38, 205, 38);
        border-top-right-radius: 1.5rem;
        border-bottom-right-radius: 1.5rem;
    }
    .register .nav-tabs .nav-link:hover{
        border: none;
    }
    .register .nav-tabs .nav-link.active{
        width: 100px;
        color: #fff;
        border: 2px solid #fff;
        border-top-left-radius: 1.5rem;
        border-bottom-left-radius: 1.5rem;
    }
    .register-heading{
        text-align: center;
        margin-top: 8%;
        margin-bottom: -15%;
        color: #0492C2;
    }
    .para_2{
      float: right;
    }
</style>

<link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">

<!------ Include the above in your HEAD tag ---------->

<div class="container register">
            <div class="row">
                
                <div class="col-md-12 register-right">
                    
                    <div class="tab" id="myTabContent">
                        <div class="tab-pane fade show active" id="home" role="tabpanel" aria-labelledby="home-tab">
                            <h3 class="register-heading">Get Yourself registered</h3>
                            <div class="row register-form">
                                <div class="col-md-6">
                                  {% for message in messages %}
                                          <span style="color:red">{{ message }}</span>
                                          {% endfor %}  
                                  <form action="register" method="POST">
                                    {% csrf_token %}
                                    <div class="form-group">
                                        <input type="text" class="form-control" placeholder="First Name" name="first_name" />
                                    </div>
                                    <div class="form-group">
                                        <input type="text" class="form-control" placeholder="Last Name" name="last_name" />
                                    </div>
                                    <div class="form-group">
                                      <input type="text" class="form-control" placeholder="Create unique username" name="username"/>
                                    </div>                                    
                                    <div class="form-group">
                                        <input type="password" class="form-control" placeholder="Password" name="psw" />
                                    </div>
                                    <div class="form-group">
                                        <input type="password" class="form-control"  placeholder="Confirm Password" name="psw_repeat" />
                                    </div>
                                    
                                    
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <input type="email" class="form-control" placeholder="Your Email" name="email"  />
                                    </div>
                                    
                                    
                                    
                                    <input type="submit" class="btnRegister"  value="submit">
                                </div>
                                <p class="para_2">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
                            </div>
                        </div>
                      </form>

   {% endblock %}
